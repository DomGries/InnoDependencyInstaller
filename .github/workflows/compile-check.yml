name: Compile Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile ExampleSetup.iss
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp ExampleSetup.iss'
