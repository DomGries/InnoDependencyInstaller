name: Check .NET Updates

on:
  schedule:
    # Run weekly on Wednesday at 9:00 AM UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for .NET updates
        id: check-updates
        shell: pwsh
        run: |
          $apiBaseUrl = "https://builds.dotnet.microsoft.com/dotnet/release-metadata"

          $updatesFound = $false
          $updateSummary = @()

          $issContent = Get-Content -Path "CodeDependencies.iss" -Raw

          Write-Host "Fetching .NET releases index..."
          try {
            $releasesIndex = Invoke-RestMethod -Uri "$apiBaseUrl/releases-index.json" -MaximumRetryCount 3 -RetryIntervalSec 5 -ErrorAction Stop
          } catch {
            Write-Error "Failed to fetch releases index: $_"
            exit 1
          }

          # All channels 5.0+ including EOL: aka.ms links serve a channel's latest patch
          # even after EOL. 3.1 stays excluded - its URLs are pinned to one build.
          $channels = $releasesIndex.'releases-index' | Where-Object {
            $_.'channel-version' -match '^\d+\.\d+$' -and
            [int]($_.'channel-version' -split '\.')[0] -ge 5
          } | Sort-Object { [int]($_.'channel-version' -split '\.')[0] }

          Write-Host "Channels to check: $($channels.'channel-version' -join ', ')"

          # Runtime versions within a release can differ, so resolve each product individually
          $products = @(
            @{ Runtime = 'Microsoft\.NETCore\.App';        JsonProperty = 'runtime';            TitlePattern = '\.NET Runtime' }
            @{ Runtime = 'Microsoft\.AspNetCore\.App';     JsonProperty = 'aspnetcore-runtime'; TitlePattern = 'ASP\.NET Core Runtime' }
            @{ Runtime = 'Microsoft\.WindowsDesktop\.App'; JsonProperty = 'windowsdesktop';     TitlePattern = '\.NET Desktop Runtime' }
          )

          foreach ($versionInfo in $channels) {
            $channel = $versionInfo.'channel-version'
            $major = [int]($channel -split '\.')[0]
            $minor = [int]($channel -split '\.')[1]

            Write-Host "`nChecking .NET $channel..."

            $releasesUrl = $versionInfo.'releases.json'
            try {
              $releases = Invoke-RestMethod -Uri $releasesUrl -MaximumRetryCount 3 -RetryIntervalSec 5 -ErrorAction Stop
            } catch {
              Write-Warning "Failed to fetch releases for .NET $channel : $_"
              continue
            }

            # latest stable release (preview/rc versions contain '-')
            $latestRelease = $releases.releases |
              Where-Object { $_.'release-version' -notmatch '-' } |
              Sort-Object { [DateTime]$_.'release-date' } -Descending |
              Select-Object -First 1

            if (-not $latestRelease) {
              Write-Warning "No stable release found for .NET $channel"
              continue
            }

            Write-Host "Latest .NET $channel release: $($latestRelease.'release-version')"
            $channelUpdates = @()

            foreach ($product in $products) {
              $latestVersion = $latestRelease.($product.JsonProperty).version
              if (-not $latestVersion -or $latestVersion -match '-') {
                continue
              }
              $latestPatch = [int]($latestVersion -split '\.')[2]

              $currentPatchPattern = "Dependency_IsNetCoreInstalled\('$($product.Runtime)',\s*$major,\s*$minor,\s*(\d+)\)"
              $currentMatch = [regex]::Match($issContent, $currentPatchPattern)

              if (-not $currentMatch.Success) {
                Write-Host "$($product.JsonProperty) $channel not found in CodeDependencies.iss - may need to be added"
                continue
              }

              $currentPatch = [int]$currentMatch.Groups[1].Value
              if ($latestPatch -gt $currentPatch) {
                Write-Host "$($product.JsonProperty) update available: $major.$minor.$currentPatch -> $latestVersion"
                $updatesFound = $true
                $channelUpdates += $latestVersion

                $issContent = $issContent -replace `
                  "(Dependency_IsNetCoreInstalled\('$($product.Runtime)',\s*$major,\s*$minor,\s*)$currentPatch(\))", `
                  "`${1}$latestPatch`${2}"

                $issContent = $issContent -replace `
                  "('$($product.TitlePattern) $major\.$minor\.)$currentPatch(')", `
                  "`${1}$latestPatch`${2}"
              } else {
                Write-Host "$($product.JsonProperty) $channel is up to date"
              }
            }

            # hosting bundle entries track the ASP.NET Core runtime version
            $aspVersion = $latestRelease.'aspnetcore-runtime'.version
            if ($aspVersion -and $aspVersion -notmatch '-' -and $minor -eq 0) {
              $latestPatch = [int]($aspVersion -split '\.')[2]
              $hostingPattern = "Dependency_AddDotNetHosting\($major,\s*(\d+),"
              $hostingMatch = [regex]::Match($issContent, $hostingPattern)
              if ($hostingMatch.Success) {
                $currentPatch = [int]$hostingMatch.Groups[1].Value
                if ($latestPatch -gt $currentPatch) {
                  Write-Host "hosting bundle update available: $major.0.$currentPatch -> $aspVersion"
                  $updatesFound = $true
                  $channelUpdates += $aspVersion
                  $issContent = $issContent -replace `
                    "(Dependency_AddDotNetHosting\($major,\s*)$currentPatch(,)", `
                    "`${1}$latestPatch`${2}"
                }
              }
            }

            if ($channelUpdates.Count -gt 0) {
              $updateSummary += ($channelUpdates | Select-Object -Unique)
            }
          }

          if ($updatesFound) {
            # Write the updated content back to the files
            [System.IO.File]::WriteAllText("CodeDependencies.iss", $issContent)

            # Set outputs for the next step
            $summaryText = $updateSummary -join ", "
            "updates_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "summary=$summaryText" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Updates found: $summaryText"
          } else {
            "updates_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "No updates found"
          }

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Update to .NET ${{ steps.check-updates.outputs.summary }}"
          title: "Update to .NET ${{ steps.check-updates.outputs.summary }}"
          body: |
            This PR updates the following .NET runtime dependencies:
            .NET ${{ steps.check-updates.outputs.summary || 'No version updates' }}
          branch: update-dotnet-dependencies
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --body "" stops GitHub appending a Co-authored-by trailer to the squash commit
        run: gh pr merge --auto --squash --body "" ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }}
