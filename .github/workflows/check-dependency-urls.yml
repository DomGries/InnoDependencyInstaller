name: Check Dependency URLs

on:
  pull_request:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check dependency URLs
        shell: pwsh
        run: |
          function Get-UrlError([string] $Url) {
            foreach ($request in @{ Method = 'Head' }, @{ Headers = @{ Range = 'bytes=0-0' } }) {
              try {
                $response = Invoke-WebRequest $Url @request -MaximumRedirection 10 -TimeoutSec 30
                if ($response.BaseResponse.RequestMessage.RequestUri.Host -eq 'www.bing.com') { return 'short link does not exist' }
                return
              } catch { $message = $_.Exception.Message }
            }
            $message
          }

          $urls = [regex]::Matches((Get-Content CodeDependencies.iss -Raw), "'(https?://[^']+)'") | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $failures = @(foreach ($url in $urls) {
            $message = Get-UrlError $url
            Write-Host "$($message ? 'FAIL' : 'OK  ') $url"
            if ($message) { "$url - $message" }
          })

          if ($failures) {
            "## Broken dependency URLs ($($failures.Count))", ($failures | ForEach-Object { "- $_" }) >> $env:GITHUB_STEP_SUMMARY
            $failures | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "All $($urls.Count) URLs reachable"
