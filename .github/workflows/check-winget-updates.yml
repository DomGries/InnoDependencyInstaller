name: Check Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for updates
        id: check-updates
        shell: pwsh
        run: |
          function Invoke-WithRetry([scriptblock] $Action) {
            for ($attempt = 1; ; $attempt++) {
              try { return & $Action } catch {
                $status = [int] $_.Exception.Response.StatusCode
                if ($attempt -ge 6 -or ($status -and $status -notin 408, 429 -and $status -lt 500)) { throw }
                Write-Host "Retrying after attempt $attempt failed: $_"
                Start-Sleep ([Math]::Min(10 * [Math]::Pow(2, $attempt - 1), 120))
              }
            }
          }

          $index = "$env:RUNNER_TEMP/winget"
          Invoke-WithRetry { Invoke-WebRequest https://cdn.winget.microsoft.com/cache/source2.msix -OutFile "$index.msix" }
          $archive = [IO.Compression.ZipFile]::OpenRead("$index.msix")
          [IO.Compression.ZipFileExtensions]::ExtractToFile($archive.GetEntry('Public/index.db'), "$index.db", $true)
          $archive.Dispose()
          $wingetVersions = @{}
          sqlite3 -separator ' ' "$index.db" 'select id, latest_version from packages' | ForEach-Object { $id, $version = $_ -split ' '; $wingetVersions[$id] = $version }
          if (-not $wingetVersions.Count) { throw 'Failed to read the WinGet source index' }

          function ConvertTo-Version([string] $Text) { [Version] (("$Text.0.0.0" -split '\.')[0..3] -join '.') }

          $manifests = @{}
          function Get-Installers([string] $Id) {
            if (-not $wingetVersions[$Id]) { throw "$Id not found in WinGet" }
            if (-not $manifests[$Id]) {
              $uri = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/$($Id.Substring(0, 1).ToLower())/$($Id.Replace('.', '/'))/$($wingetVersions[$Id])/$Id.installer.yaml"
              $manifest = Invoke-WithRetry { Invoke-RestMethod $uri }
              $manifests[$Id] = @([regex]::Matches($manifest, '(?ms)^- .*?(?=^- |\z)') | ForEach-Object {
                $field = @{}
                foreach ($match in [regex]::Matches($_.Value, '(?m)^[ -]*(Architecture|InstallerLocale|InstallerUrl|InstallerSha256):\s*(\S+)')) { $field[$match.Groups[1].Value] ??= $match.Groups[2].Value }
                if ($field.InstallerSha256 -match '^[0-9a-f]{64}$' -and $field.InstallerLocale -in $null, 'en-US') {
                  [pscustomobject] @{ Architecture = $field.Architecture; Url = $field.InstallerUrl -replace '#.*'; Checksum = $field.InstallerSha256.ToLower() }
                }
              })
            }
            $manifests[$Id]
          }

          function Select-Installer($Target, [string] $Arch) {
            $id = $Target.Id -replace '\{arch\}', $Arch
            $found = @(Get-Installers $id |
              Where-Object { $_.Url -match ($Target.Url ?? '^https://(aka\.ms|([\w-]+\.)*microsoft\.com)/') -and (-not $Arch -or $_.Architecture -eq $Arch) } |
              Sort-Object Url, Checksum -Unique)
            if ($found.Count -ne 1) { throw "Expected one trusted $Arch installer in $id, found $($found.Count)" }
            $found[0]
          }

          function Test-Url([string] $Url) {
            foreach ($request in @{ Method = 'Head' }, @{ Headers = @{ Range = 'bytes=0-0' } }) {
              try { return (Invoke-WebRequest $Url @request -MaximumRedirection 10 -TimeoutSec 60).BaseResponse.RequestMessage.RequestUri.Host -ne 'www.bing.com' } catch {}
            }
            $false
          }

          function Get-ProcedurePattern([string] $Name) {
            "(?m)^procedure Dependency_Add$Name;(?:.*end;$|(?s:.*?)^end;)"
          }

          $targets = @(
            foreach ($year in 2005, 2008, 2010, 2012, 2013) {
              @{ Name = "VC++ $year"; Id = "Microsoft.VCRedist.$year.{arch}"; Block = Get-ProcedurePattern "VC$year"; Version = "'\),\s*(?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+),\s*(?<revision>\d+)," }
            }
            @{ Name = 'VC++ 2015-2022'; Id = 'Microsoft.VCRedist.2015+.{arch}'; Block = Get-ProcedurePattern 'VC14'; Version = 'PackVersionComponents\((?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+),\s*(?<revision>\d+)\)' }
            foreach ($channel in '3_1', '5', '6', '7', '8', '9', '10') {
              $procedure = if ($channel -eq '3_1') { 'NetCore31' } else { "DotNet$($channel)0" }
              foreach ($family in @{ Id = 'Runtime'; Suffix = '' }, @{ Id = 'AspNetCore'; Suffix = 'Asp' }, @{ Id = 'DesktopRuntime'; Suffix = 'Desktop' }) {
                @{ Name = '.NET'; Id = "Microsoft.DotNet.$($family.Id).$channel"; Block = Get-ProcedurePattern "$procedure$($family.Suffix)"; Version = "',\s*(?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+)," }
              }
            }
            foreach ($major in 8, 9, 10) {
              @{ Name = '.NET'; Id = "Microsoft.DotNet.HostingBundle.$major"; Block = Get-ProcedurePattern "DotNet$($major)0Hosting"; Version = 'Hosting\((?<major>\d+),\s*(?<build>\d+),' }
            }
            foreach ($channel in '1.6', '1.7', '1.8', '2') {
              @{ Name = 'Windows App Runtime'; Id = "Microsoft.WindowsAppRuntime.$channel"; Block = Get-ProcedurePattern "WinAppRuntime$($channel.Replace('.', ''))" }
            }
            foreach ($year in 2017, 2019, 2022, 2025) {
              @{ Name = "SQL Server $year Express"; Id = "Microsoft.SQLServer.$year.Express"; Block = Get-ProcedurePattern "Sql$($year)Express"; UrlOnly = $true }
            }
            @{ Name = 'WebView2 Runtime'; Id = 'Microsoft.EdgeWebView2Runtime'; Block = Get-ProcedurePattern 'WebView2'; Evergreen = $true }
            @{ Name = 'DirectX Runtime'; Id = 'Microsoft.DirectX'; Block = Get-ProcedurePattern 'DirectX'; Url = '^https://download\.microsoft\.com/.*/dxwebsetup\.exe$' }
            @{ Name = 'ODBC Driver 18'; Id = 'Microsoft.msodbcsql.18'; Block = Get-ProcedurePattern 'SqlOdbc18' }
            @{ Name = 'Access Database Engine 2016'; Id = 'Microsoft.AccessDatabaseEngine2016'; Block = Get-ProcedurePattern 'AccessDatabaseEngine2016' }
            @{ Name = 'VSTO Runtime'; Id = 'Microsoft.VSTOR'; Block = Get-ProcedurePattern 'VSTORuntime' }
            foreach ($major in 11, 17, 21, 25) {
              @{ Name = 'Microsoft OpenJDK'; Id = "Microsoft.OpenJDK.$major"; Block = Get-ProcedurePattern "Java$major"; Version = 'microsoft-jdk-(?<version>[\d.]+)-windows' }
            }
            foreach ($minor in 13, 14) {
              @{ Name = 'Python'; Id = "Python.Python.3.$minor"; Block = Get-ProcedurePattern "Python3$minor"; Version = '/python/(?<version>[\d.]+)/'; Url = '^https://www\.python\.org/ftp/python/[\d.]+/python-[^/]+\.exe$' }
            }
            @{ Name = 'PowerShell'; Id = 'Microsoft.PowerShell'; Block = Get-ProcedurePattern 'PowerShell7'; Version = '/download/v(?<version>[\d.]+)/'; Url = '^https://github\.com/PowerShell/PowerShell/releases/download/v[\d.]+/PowerShell-[^/]+\.msi$' }
          )

          $updates = @()
          $failures = @()

          function Get-LatestChannel([string] $Prefix, $Ids) {
            (@($Ids) -match "^$([regex]::Escape($Prefix))\d+$" | ForEach-Object { [int] $_.Substring($Prefix.Length) } | Measure-Object -Maximum).Maximum
          }
          foreach ($family in @{ '.NET ' = 'Microsoft.DotNet.Runtime.'; 'Microsoft OpenJDK ' = 'Microsoft.OpenJDK.'; 'Python 3.' = 'Python.Python.3.' }.GetEnumerator()) {
            $available = Get-LatestChannel $family.Value $wingetVersions.Keys
            if ($available -gt (Get-LatestChannel $family.Value $targets.Id)) { $failures += "$($family.Key)$available is available but not supported in CodeDependencies.iss" }
          }

          $content = Get-Content CodeDependencies.iss -Raw
          foreach ($target in $targets) {
            $id = $target.Id -replace '\{arch\}', 'x64'
            try {
              $block = [regex]::Match($content, $target.Block)
              if (-not $block.Success) { throw 'dependency not found in CodeDependencies.iss' }
              $latestText = $wingetVersions[$id]
              if (-not $latestText) { throw 'not found in WinGet' }
              $updated = $block.Value
              $bumped = $false

              if ($target.UrlOnly) {
                Write-Host "$($target.Name) [$id]: version not tracked, checking downloads"
              } else {
                $version = [regex]::Match($updated, $target.Version ?? '(?m)^\s*// \S+ - (?<version>\d+(?:\.\d+)+)\s*$')
                if (-not $version.Success) { throw 'current version not found in CodeDependencies.iss' }
                $currentText = $version.Groups['version'].Value
                if (-not $currentText) { $currentText = ('major', 'minor', 'build', 'revision' | ForEach-Object { [int] $version.Groups[$_].Value }) -join '.' }
                $current = ConvertTo-Version $currentText
                $latest = ConvertTo-Version $latestText
                Write-Host "$($target.Name) [$id]: $current -> $latest"
                if ($latest -lt $current) { continue }
                if ($latest -gt $current) {
                  if ($latest.Major -ne $current.Major -and -not $target.Evergreen) { throw "$latestText is outside the $($current.Major).x channel" }
                  $values = @{ major = $latest.Major; minor = $latest.Minor; build = $latest.Build; revision = $latest.Revision; version = $latestText }
                  foreach ($group in $version.Groups | Where-Object { $_.Success -and $values.ContainsKey($_.Name) } | Sort-Object Index -Descending) {
                    $updated = $updated.Remove($group.Index, $group.Length).Insert($group.Index, $values[$group.Name])
                  }
                  $bumped = $true
                }
              }

              $urlRef = @([regex]::Matches($updated, "Dependency_String\w*\((?:'(?:https://[^']*)?',?\s*){2,}\)|'https://[^']*'"))
              $hashRef = @([regex]::Matches($updated, "Dependency_String\w*\((?:'(?:[0-9a-f]{64})?',?\s*){2,}\)|'[0-9a-f]{64}'"))
              if ($urlRef.Count -ne 1 -or $hashRef.Count -ne 1) { throw 'expected one URL/checksum pair' }
              $slots = @([regex]::Matches($urlRef[0].Value, "'([^']*)'") | ForEach-Object { $_.Groups[1].Value })
              $installers = @(for ($i = 0; $i -lt $slots.Count; $i++) {
                if (-not $slots[$i]) { @{ Url = ''; Checksum = '' } }
                else { Select-Installer $target ($slots.Count -gt 1 ? ('x86', 'x64', 'arm64')[$i] : '') }
              })
              $updated = $updated.Replace($urlRef[0].Value, ($urlRef[0].Value -replace "'.*'", { "'$($installers.Url -join "', '")'" }))
              $updated = $updated.Replace($hashRef[0].Value, ($hashRef[0].Value -replace "'.*'", { "'$($installers.Checksum -join "', '")'" }))

              if ($updated -eq $block.Value) { continue }
              $oldUrls = @([regex]::Matches($block.Value, "'(https://[^']*)'") | ForEach-Object { $_.Groups[1].Value })
              $newUrls = @($installers.Url) -ne ''
              if (-not $bumped -and -not ($oldUrls | Where-Object { $_ -notin $newUrls -and -not (Test-Url $_) })) { continue }
              $deadUrls = @($newUrls | Where-Object { $_ -notin $oldUrls -and -not (Test-Url $_) })
              if ($deadUrls -and $bumped) { throw "unreachable WinGet download: $deadUrls" }
              if ($deadUrls) { Write-Warning "$($target.Name): download is gone and WinGet has no working one"; continue }
              $updates += $bumped ? "$($target.Name) $($latestText -replace '^(\d+\.\d+\.\d+)\.0$', '$1')" : "$($target.Name) download"
              $content = $content.Remove($block.Index, $block.Length).Insert($block.Index, $updated)
            } catch {
              $failures += "$($target.Name) [$id]: $_"
            }
          }

          if ($updates) { Set-Content CodeDependencies.iss $content -NoNewline }
          "summary=$(($updates | Sort-Object -Unique) -join ', ')" >> $env:GITHUB_OUTPUT
          if ($failures) { 'failures<<EOF', ($failures -join "`n"), 'EOF' >> $env:GITHUB_OUTPUT }

      - name: Generate app token
        id: app-token
        if: steps.check-updates.outputs.summary
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.summary
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Update ${{ steps.check-updates.outputs.summary }}"
          title: "Update ${{ steps.check-updates.outputs.summary }}"
          body: |
            Automated update based on WinGet package metadata:
            ${{ steps.check-updates.outputs.summary }}
          branch: update-winget-dependencies
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash --body "" ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }}

      - name: Report failures
        if: ${{ !cancelled() && steps.check-updates.outputs.failures }}
        env:
          FAILURES: ${{ steps.check-updates.outputs.failures }}
        run: |
          echo "$FAILURES" | sed 's/^/::error::/'
          exit 1
