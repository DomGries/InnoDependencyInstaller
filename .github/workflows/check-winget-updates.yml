name: Check Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for updates
        id: check-updates
        shell: pwsh
        run: |
          $issPath = 'CodeDependencies.iss'
          $content = Get-Content -Path $issPath -Raw
          $updates = @()
          $failures = @()
          $manifestCache = @{}

          function Invoke-WithRetry {
            param([scriptblock] $Action, [string] $Description)
            $delay = 10
            for ($attempt = 1; ; $attempt++) {
              try {
                return & $Action
              } catch {
                $response = $_.Exception.Response
                $status = if ($response) { [int] $response.StatusCode } else { 0 }
                if (-not ($status -eq 0 -or $status -in 408, 429 -or $status -ge 500) -or $attempt -ge 6) { throw }
                Write-Host "$Description failed with status $status (attempt $attempt), retrying in $delay s"
                Start-Sleep -Seconds $delay
                $delay = [Math]::Min($delay * 2, 120)
              }
            }
          }

          $indexUri = 'https://cdn.winget.microsoft.com/cache/source2.msix'
          $temporaryDirectory = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $indexPackage = Join-Path $temporaryDirectory 'winget-source.msix'
          $indexDatabase = Join-Path $temporaryDirectory 'winget-index.db'
          Invoke-WithRetry { Invoke-WebRequest $indexUri -OutFile $indexPackage -UseBasicParsing -ErrorAction Stop } $indexUri
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($indexPackage)
          try {
            $entry = $archive.GetEntry('Public/index.db')
            if (-not $entry) { throw "Public/index.db not found in $indexUri" }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $indexDatabase, $true)
          } finally {
            $archive.Dispose()
          }

          $wingetVersions = @{}
          foreach ($row in (sqlite3 -separator "`t" $indexDatabase 'select id, latest_version from packages')) {
            $fields = $row -split "`t", 2
            if ($fields.Count -eq 2) { $wingetVersions[$fields[0]] = $fields[1] }
          }
          if ($LASTEXITCODE -ne 0 -or $wingetVersions.Count -eq 0) { throw 'Failed to read the WinGet source index' }
          Write-Host "Loaded $($wingetVersions.Count) packages from the WinGet source index"

          function ConvertTo-Version([string] $Text) {
            $parts = @($Text.Split('.') | ForEach-Object { [int] $_ }) + @(0, 0, 0)
            [Version]::new($parts[0], $parts[1], $parts[2], $parts[3])
          }

          # English installers of the latest manifest, without the WinGet-only URL fragment
          function Get-WingetInstallers([string] $Id) {
            if (-not $manifestCache.ContainsKey($Id)) {
              $version = $wingetVersions[$Id]
              if (-not $version) { throw "$Id not found in the WinGet source index" }
              $path = $Id.Substring(0, 1).ToLowerInvariant() + '/' + $Id.Replace('.', '/')
              $uri = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/$path/$version/$Id.installer.yaml"
              $manifest = Invoke-WithRetry { (Invoke-WebRequest $uri -UseBasicParsing -ErrorAction Stop).Content } $uri
              $manifestCache[$Id] = @([regex]::Matches($manifest, '(?ms)^- .*?(?=^- |\z)') | ForEach-Object {
                $arch = [regex]::Match($_.Value, '(?m)^\s*(?:-\s*)?Architecture:\s*(\S+)')
                $url = [regex]::Match($_.Value, '(?m)^\s*InstallerUrl:\s*(\S+)')
                $hash = [regex]::Match($_.Value, '(?m)^\s*InstallerSha256:\s*([0-9A-Fa-f]{64})\s*$')
                $locale = [regex]::Match($_.Value, '(?m)^\s*(?:-\s*)?InstallerLocale:\s*(\S+)')
                if ($arch.Success -and $url.Success -and $hash.Success -and (-not $locale.Success -or $locale.Groups[1].Value -eq 'en-US')) {
                  [pscustomobject]@{
                    Architecture = $arch.Groups[1].Value
                    Url          = $url.Groups[1].Value -replace '#.*$'
                    Checksum     = $hash.Groups[1].Value.ToLowerInvariant()
                  }
                }
              })
            }
            $manifestCache[$Id]
          }

          # the URL pattern doubles as host allowlist, so only trusted installers are ever picked
          function Select-Installer($Target, [string] $Arch) {
            $id = $Target.Id -replace '\{arch\}', $Arch
            $urlPattern = if ($Target.Url) { $Target.Url } else { '^https://(aka\.ms|([\w-]+\.)*microsoft\.com)/' }
            $found = @(Get-WingetInstallers $id |
              Where-Object { $_.Url -match $urlPattern -and (-not $Arch -or $_.Architecture -eq $Arch) } |
              Sort-Object Url, Checksum -Unique)
            if ($found.Count -ne 1) { throw "Expected one trusted $Arch installer in $id, found $($found.Count)" }
            $found[0]
          }

          function Test-Url([string] $Url) {
            foreach ($request in @{ Method = 'Head' }, @{ Method = 'Get'; Headers = @{ Range = 'bytes=0-0' } }) {
              try {
                Invoke-WebRequest $Url @request -MaximumRedirection 10 -TimeoutSec 60 -UseBasicParsing -ErrorAction Stop | Out-Null
                return $true
              } catch {}
            }
            $false
          }

          function Get-ProcedurePattern([string] $Name) {
            "(?m)^procedure Dependency_Add$Name;(?:.*end;$|(?s:.*?)^end;)"
          }

          # a dependency without Version keeps it in its "// <url> - <version>" comment
          $commentVersion = '(?m)^\s*// \S+ - (?<version>\d+(?:\.\d+)+)\s*$'
          $targets = @(
            foreach ($year in 2005, 2008, 2010, 2012, 2013) {
              @{ Name = "VC++ $year"; Id = "Microsoft.VCRedist.$year.{arch}"; Block = Get-ProcedurePattern "VC$year"; Version = "'\),\s*(?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+),\s*(?<revision>\d+)," }
            }
            @{ Name = 'VC++ 2015-2022'; Id = 'Microsoft.VCRedist.2015+.{arch}'; Block = Get-ProcedurePattern 'VC14'; Version = 'PackVersionComponents\((?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+),\s*(?<revision>\d+)\)' }
            foreach ($channel in '3_1', '5', '6', '7', '8', '9', '10') {
              $procedure = if ($channel -eq '3_1') { 'NetCore31' } else { "DotNet$($channel)0" }
              foreach ($family in @{ Id = 'Runtime'; Suffix = '' }, @{ Id = 'AspNetCore'; Suffix = 'Asp' }, @{ Id = 'DesktopRuntime'; Suffix = 'Desktop' }) {
                @{ Name = '.NET'; Id = "Microsoft.DotNet.$($family.Id).$channel"; Block = Get-ProcedurePattern "$procedure$($family.Suffix)"; Version = "',\s*(?<major>\d+),\s*(?<minor>\d+),\s*(?<build>\d+)," }
              }
            }
            foreach ($major in 8, 9, 10) {
              @{ Name = '.NET'; Id = "Microsoft.DotNet.HostingBundle.$major"; Block = Get-ProcedurePattern "DotNet$($major)0Hosting"; Version = 'Hosting\((?<major>\d+),\s*(?<build>\d+),' }
            }
            foreach ($channel in '1.6', '1.7', '1.8', '2') {
              @{ Name = 'Windows App Runtime'; Id = "Microsoft.WindowsAppRuntime.$channel"; Block = Get-ProcedurePattern "WinAppRuntime$($channel.Replace('.', ''))" }
            }
            # the WinGet version of SQL Server Express is its setup bootstrapper's, so the minimum engine version stays as is
            foreach ($year in 2017, 2019, 2022, 2025) {
              @{ Name = "SQL Server $year Express"; Id = "Microsoft.SQLServer.$year.Express"; Block = Get-ProcedurePattern "Sql$($year)Express"; UrlOnly = $true }
            }
            @{ Name = 'WebView2 Runtime'; Id = 'Microsoft.EdgeWebView2Runtime'; Block = Get-ProcedurePattern 'WebView2' }
            @{ Name = 'DirectX Runtime'; Id = 'Microsoft.DirectX'; Block = Get-ProcedurePattern 'DirectX'; Url = '^https://download\.microsoft\.com/.*/dxwebsetup\.exe$' }
            @{ Name = 'ODBC Driver 18'; Id = 'Microsoft.msodbcsql.18'; Block = Get-ProcedurePattern 'SqlOdbc18' }
            @{ Name = 'Access Database Engine 2016'; Id = 'Microsoft.AccessDatabaseEngine2016'; Block = Get-ProcedurePattern 'AccessDatabaseEngine2016' }
            @{ Name = 'VSTO Runtime'; Id = 'Microsoft.VSTOR'; Block = Get-ProcedurePattern 'VSTORuntime' }
            foreach ($major in 11, 17, 21, 25) {
              @{ Name = 'Microsoft OpenJDK'; Id = "Microsoft.OpenJDK.$major"; Block = Get-ProcedurePattern "Java$major"; Version = 'microsoft-jdk-(?<version>[\d.]+)-windows' }
            }
            foreach ($minor in 13, 14) {
              @{ Name = 'Python'; Id = "Python.Python.3.$minor"; Block = Get-ProcedurePattern "Python3$minor"; Version = '/python/(?<version>[\d.]+)/'; Url = '^https://www\.python\.org/ftp/python/[\d.]+/python-[^/]+\.exe$' }
            }
            @{ Name = 'PowerShell'; Id = 'Microsoft.PowerShell'; Block = Get-ProcedurePattern 'PowerShell7'; Version = '/download/v(?<version>[\d.]+)/'; Url = '^https://github\.com/PowerShell/PowerShell/releases/download/v[\d.]+/PowerShell-[^/]+\.msi$' }
          )

          # a new channel needs its own procedure, so only report it
          function Get-LatestChannel([string] $Prefix, $Ids) {
            ($Ids | ForEach-Object { if ($_ -match "^$([regex]::Escape($Prefix))(\d+)$") { [int] $Matches[1] } } | Measure-Object -Maximum).Maximum
          }
          foreach ($family in @{ '.NET ' = 'Microsoft.DotNet.Runtime.'; 'Microsoft OpenJDK ' = 'Microsoft.OpenJDK.'; 'Python 3.' = 'Python.Python.3.' }.GetEnumerator()) {
            $available = Get-LatestChannel $family.Value $wingetVersions.Keys
            if ($available -gt (Get-LatestChannel $family.Value ($targets | ForEach-Object { $_.Id }))) {
              $failures += "$($family.Key)$available is available but not supported in CodeDependencies.iss"
            }
          }

          foreach ($target in $targets) {
            $id = $target.Id -replace '\{arch\}', 'x64'
            try {
              $latestText = $wingetVersions[$id]
              if (-not $latestText) { throw 'not found in the WinGet source index' }
              $latest = ConvertTo-Version $latestText

              $block = [regex]::Match($content, $target.Block)
              if (-not $block.Success) { throw 'dependency not found in CodeDependencies.iss' }
              $updated = $block.Value
              $bumped = $false
              if ($target.UrlOnly) {
                Write-Host "$($target.Name) [$id]: version not tracked, checking downloads"
              } else {
                $versionPattern = if ($target.Version) { $target.Version } else { $commentVersion }
                $versionMatch = [regex]::Match($block.Value, $versionPattern)
                if (-not $versionMatch.Success) { throw 'current version not found in CodeDependencies.iss' }
                $currentText = if ($versionMatch.Groups['version'].Success) { $versionMatch.Groups['version'].Value } else {
                  (@('major', 'minor', 'build', 'revision') | ForEach-Object { if ($versionMatch.Groups[$_].Success) { $versionMatch.Groups[$_].Value } else { 0 } }) -join '.'
                }
                $current = ConvertTo-Version $currentText
                Write-Host "$($target.Name) [$id]: $current -> $latest"
                if ($latest -gt $current) {
                  if ($latest.Major -ne $current.Major) { throw "$latestText is outside the $($current.Major).x channel" }
                  $components = @{ major = $latest.Major; minor = $latest.Minor; build = $latest.Build; revision = $latest.Revision; version = $latestText }
                  foreach ($group in @($versionMatch.Groups | Where-Object { $_.Success -and $components.ContainsKey($_.Name) } | Sort-Object Index -Descending)) {
                    $updated = $updated.Remove($group.Index, $group.Length).Insert($group.Index, [string] $components[$group.Name])
                  }
                  $bumped = $true
                }
              }

              $urlCalls = [regex]::Matches($updated, "Dependency_String(?:X64)?\('(?:https://[^']*)?'(?:,\s*'https://[^']*')+\)")
              $hashCalls = [regex]::Matches($updated, "Dependency_String(?:X64)?\('(?:[0-9a-f]{64})?'(?:,\s*'[0-9a-f]{64}')+\)")
              if ($urlCalls.Count -eq 1 -and $hashCalls.Count -eq 1) {
                $urls = @([regex]::Matches($urlCalls[0].Value, "'([^']*)'") | ForEach-Object { $_.Groups[1].Value })
                $newUrls = @()
                $newHashes = @()
                for ($i = 0; $i -lt $urls.Count; $i++) {
                  # an empty slot stays unavailable and an arm64 slot reusing the x64 download keeps doing so
                  if (-not $urls[$i]) { $newUrls += ''; $newHashes += ''; continue }
                  $arch = @('x86', 'x64', 'arm64')[$i]
                  if ($arch -eq 'arm64' -and $urls[2] -eq $urls[1]) { $arch = 'x64' }
                  $installer = Select-Installer $target $arch
                  $newUrls += $installer.Url
                  $newHashes += $installer.Checksum
                }
                foreach ($call in @{ Match = $urlCalls[0]; Values = $newUrls }, @{ Match = $hashCalls[0]; Values = $newHashes }) {
                  $arguments = ($call.Values | ForEach-Object { "'$_'" }) -join ', '
                  $updated = $updated.Replace($call.Match.Value, $call.Match.Value.Split('(')[0] + "($arguments)")
                }
              } else {
                $url = @([regex]::Matches($updated, "'(https://[^']*)'"))
                $hash = @([regex]::Matches($updated, "'([0-9a-f]{64})'"))
                if ($url.Count -ne 1 -or $hash.Count -ne 1) { throw 'expected one URL/checksum pair' }
                $installer = Select-Installer $target ''
                $updated = $updated.Replace($url[0].Value, "'$($installer.Url)'").Replace($hash[0].Value, "'$($installer.Checksum)'")
              }

              # case-insensitive, as WinGet often differs only in URL casing
              if ($updated -eq $block.Value) { continue }
              $oldUrls = @([regex]::Matches($block.Value, "'(https://[^']+)'") | ForEach-Object { $_.Groups[1].Value })
              $newUrls = @([regex]::Matches($updated, "'(https://[^']+)'") | ForEach-Object { $_.Groups[1].Value })
              # without a new version, WinGet only replaces downloads that are gone
              if (-not $bumped -and -not ($oldUrls | Where-Object { $_ -notin $newUrls -and -not (Test-Url $_) })) { continue }
              $deadUrls = @($newUrls | Where-Object { $_ -notin $oldUrls -and -not (Test-Url $_) })
              if ($bumped) {
                if ($deadUrls) { throw "unreachable WinGet download: $($deadUrls -join ', ')" }
                $updates += "$($target.Name) $($latestText -replace '^(\d+\.\d+\.\d+)\.0$', '$1')"
              } else {
                if ($deadUrls) { Write-Warning "$($target.Name): download is gone and WinGet has no working one"; continue }
                $updates += "$($target.Name) download"
              }
              $content = $content.Remove($block.Index, $block.Length).Insert($block.Index, $updated)
            } catch {
              $failures += "$($target.Name) [$id]: $_"
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

          if ($updates.Count -gt 0) {
            [System.IO.File]::WriteAllText($issPath, $content)
            $summary = ($updates | Sort-Object -Unique) -join ', '
            "updates_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "summary=$summary"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nUpdates found: $summary"
          } else {
            "updates_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nNo updates found"
          }

      - name: Generate app token
        id: app-token
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Update ${{ steps.check-updates.outputs.summary }}"
          title: "Update ${{ steps.check-updates.outputs.summary }}"
          body: |
            Automated update based on WinGet package metadata:
            ${{ steps.check-updates.outputs.summary }}
          branch: update-winget-dependencies
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash --body "" ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }}
