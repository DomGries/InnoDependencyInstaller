name: Check Dependency Updates

on:
  schedule:
    # Run weekly on Wednesday at 9:00 AM UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for updates
        id: check-updates
        shell: pwsh
        run: |
          $apiBase = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests"
          $issPath = "CodeDependencies.iss"
          $content = Get-Content -Path $issPath -Raw
          $updates = @()
          $failures = @()
          $hashCache = @{}

          function Get-WingetVersions {
            param([string] $Path)
            $entries = Invoke-RestMethod "$apiBase/$Path" -Headers $headers -ErrorAction Stop
            @($entries | Where-Object type -eq 'dir' | ForEach-Object {
              try { [Version]$_.name } catch { }
            })
          }

          function Get-WingetInstallers {
            param([string] $Path, [Version] $Version)
            $files = Invoke-RestMethod "$apiBase/$Path/$Version" -Headers $headers -ErrorAction Stop
            $entry = $files | Where-Object name -like '*.installer.yaml' | Select-Object -First 1
            if (-not $entry) { throw "Installer manifest not found for $Path $Version" }

            $manifest = (Invoke-WebRequest $entry.download_url -Headers $headers -ErrorAction Stop).Content
            $installers = @([regex]::Matches(
              $manifest,
              '(?ms)^- Architecture:\s*(?<arch>\S+).*?^\s*InstallerUrl:\s*(?<url>\S+).*?^\s*InstallerSha256:\s*(?<hash>[0-9A-Fa-f]{64})\s*$'
            ) | ForEach-Object {
              [pscustomobject]@{
                Architecture = $_.Groups['arch'].Value
                Url          = $_.Groups['url'].Value
                Checksum     = $_.Groups['hash'].Value.ToLowerInvariant()
              }
            })
            if ($installers.Count -eq 0) { throw "No installers found in manifest for $Path $Version" }
            $installers
          }

          function New-DependencyString {
            param([string[]] $Values)
            $name = if ($Values.Count -eq 2) { 'Dependency_StringX64' } else { 'Dependency_String' }
            "$name(" + (($Values | ForEach-Object { "'$_'" }) -join ', ') + ')'
          }

          function Confirm-DotNetInstaller {
            param($Installer)
            $allowedHosts = 'builds.dotnet.microsoft.com', 'download.visualstudio.microsoft.com'
            if (([Uri]$Installer.Url).Host -notin $allowedHosts) {
              throw "Unexpected .NET installer host: $($Installer.Url)"
            }
            $Installer
          }

          function Test-UpdateAvailable {
            param([string] $Name, [Version] $Current, [Version] $Latest)
            Write-Host "`nChecking $Name`: $Current -> $Latest"
            $Latest -gt $Current
          }

          function Set-BlockHashes {
            param([string] $Block)
            $urls = @([regex]::Matches($Block, "'(https?://[^']+)'") |
              ForEach-Object { $_.Groups[1].Value })
            $hashPattern = [regex]"'[0-9a-fA-F]{64}'"
            $matches = $hashPattern.Matches($Block)
            if ($urls.Count -ne $matches.Count) {
              throw "URL/checksum count mismatch in updated dependency block"
            }
            $hashes = @($urls | ForEach-Object {
              if (-not $hashCache.ContainsKey($_)) {
                $hashCache[$_] = & ./tools/Get-UrlSha256.ps1 $_
              }
              $hashCache[$_]
            })
            for ($i = $matches.Count - 1; $i -ge 0; $i--) {
              $Block = $Block.Remove($matches[$i].Index, $matches[$i].Length).
                Insert($matches[$i].Index, "'$($hashes[$i])'")
            }
            $Block
          }

          $targets = @(
            @{
              Name    = 'VC++ 2015-2022'
              Path    = 'm/Microsoft/VCRedist/2015+/x64'
              Major   = 14
              Kind    = 'components'
              Pattern = '(VisualStudio\\14\.0\\VC\\Runtimes[\s\S]*?PackVersionComponents\(14,\s*)(\d+),\s*(\d+),\s*(\d+)(\))'
              BlockPattern = '(?ms)^procedure Dependency_AddVC14;.*?^end;'
            },
            @{
              Name    = 'SQL Server 2022 Express'
              Path    = 'm/Microsoft/SQLServer/2022/Express'
              Major   = 16
              Kind    = 'components'
              Pattern = "(Dependency_AddSqlExpress\('2022',\s*'MSSQL16\.MSSQLSERVER',\s*'[^']+',\s*16,\s*)(\d+),\s*(\d+),\s*(\d+)(,)"
              BlockPattern = '(?m)^procedure Dependency_AddSql2022Express;.*$'
            },
            @{
              Name    = 'SQL Server 2025 Express'
              Path    = 'm/Microsoft/SQLServer/2025/Express'
              Major   = 17
              Kind    = 'components'
              Pattern = "(Dependency_AddSqlExpress\('2025',\s*'MSSQL17\.MSSQLSERVER',\s*'[^']+',\s*17,\s*)(\d+),\s*(\d+),\s*(\d+)(,)"
              BlockPattern = '(?m)^procedure Dependency_AddSql2025Express;.*$'
            },
            @{
              Name    = 'Windows App Runtime 2'
              Repo    = 'microsoft/WindowsAppSDK'
              Major   = 2
              Kind    = 'text'
              Pattern = '(?ms)^procedure Dependency_AddWinAppRuntime2;.*?^end;'
              VersionPattern = '/windowsappsdk/\d+\.\d+/(\d+\.\d+\.\d+)/'
              UrlPattern = '/windowsappsdk/\d+\.\d+/\d+\.\d+\.\d+/'
            },
            @{
              Name    = 'Python 3.13'
              Path    = 'p/Python/Python/3/13'
              Major   = 3
              Minor   = 13
              Kind    = 'text'
              Pattern = '(?m)^procedure Dependency_AddPython313;.*$'
              VersionPattern = '/python/(\d+\.\d+\.\d+)/'
            },
            @{
              Name    = 'Python 3.14'
              Path    = 'p/Python/Python/3/14'
              Major   = 3
              Minor   = 14
              Kind    = 'text'
              Pattern = '(?m)^procedure Dependency_AddPython314;.*$'
              VersionPattern = '/python/(\d+\.\d+\.\d+)/'
            },
            @{
              Name    = 'PowerShell 7'
              Path    = 'm/Microsoft/PowerShell'
              Major   = 7
              Kind    = 'text'
              Pattern = '(?ms)^procedure Dependency_AddPowerShell7;.*?^end;'
              VersionPattern = '/download/v(\d+\.\d+\.\d+)/'
            }
          )

          $targets += 11, 17, 21, 25 | ForEach-Object {
            @{
              Name           = "Microsoft OpenJDK $_"
              Path           = "m/Microsoft/OpenJDK/$_"
              Major          = $_
              Kind           = 'text'
              Pattern        = "(?m)^procedure Dependency_AddJava$_;.*$"
              VersionPattern = 'microsoft-jdk-(\d+\.\d+\.\d+)-windows'
            }
          }

          $headers = @{ 'Accept' = 'application/vnd.github.v3+json' }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }

          try {
            $pythonChannels = Invoke-RestMethod "$apiBase/p/Python/Python/3" -Headers $headers -ErrorAction Stop
            $latestPythonMinor = $pythonChannels |
              Where-Object { $_.type -eq 'dir' -and $_.name -match '^\d+$' } |
              ForEach-Object { [int]$_.name } |
              Sort-Object |
              Select-Object -Last 1
            $supportedPythonMinor = ($targets | Where-Object { $_.Name -like 'Python *' } | ForEach-Object { [int]$_.Minor } | Measure-Object -Maximum).Maximum
            if ($null -eq $latestPythonMinor) {
              $failures += "No Python 3 channels found"
            } elseif ($latestPythonMinor -gt $supportedPythonMinor) {
              $failures += "Python 3.$latestPythonMinor is available but not supported in CodeDependencies.iss"
            }
          } catch {
            $failures += "Failed to discover Python channels: $_"
          }

          foreach ($target in $targets) {
            try {
              if ($target.Repo) {
                $data = Invoke-RestMethod "https://api.github.com/repos/$($target.Repo)/releases?per_page=100" -Headers $headers -ErrorAction Stop
                $versions = @($data |
                  Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
                  ForEach-Object { [Version]$_.tag_name.Substring(1) })
              } else {
                $versions = @(Get-WingetVersions $target.Path)
              }
            } catch {
              $failures += "Failed to fetch $($target.Name) release metadata: $_"
              continue
            }

            if ($versions.Count -eq 0) {
              $failures += "No versions found for $($target.Name)"
              continue
            }

            $latest = ($versions | Sort-Object | Select-Object -Last 1)
            if (($latest.Major -ne $target.Major) -or (($null -ne $target.Minor) -and ($latest.Minor -ne $target.Minor))) {
              $failures += "$($target.Name) latest version $latest is outside its expected channel"
              continue
            }
            if ($target.Kind -eq 'text') {
              $latest = [Version]"$($latest.Major).$($latest.Minor).$($latest.Build)"
            }

            $match = [regex]::Match($content, $target.Pattern)
            if (-not $match.Success) {
              $failures += "$($target.Name) version pattern not found in CodeDependencies.iss"
              continue
            }

            if ($target.Kind -eq 'components') {
              $current = [Version]"$($target.Major).$($match.Groups[2].Value).$($match.Groups[3].Value).$($match.Groups[4].Value)"
              $replacement = "`${1}$($latest.Minor), $($latest.Build), $($latest.Revision)`${5}"
            } else {
              $versionMatch = [regex]::Match($match.Value, $target.VersionPattern)
              if (-not $versionMatch.Success) {
                $failures += "$($target.Name) current version not found in CodeDependencies.iss"
                continue
              }
              $current = [Version]$versionMatch.Groups[1].Value
              if ($target.UrlPattern) {
                $replacement = [regex]::Replace($match.Value, $target.UrlPattern, "/windowsappsdk/$($latest.Major).$($latest.Minor)/$latest/")
              } else {
                $replacement = $match.Value.Replace($versionMatch.Groups[1].Value, "$latest")
              }
            }
            if (-not (Test-UpdateAvailable $target.Name $current $latest)) { continue }
            if ($target.Kind -eq 'text') {
              $content = $content.Replace($match.Value, $replacement)
            } else {
              $content = [regex]::Replace($content, $target.Pattern, $replacement)
            }

            $blockPattern = if ($target.BlockPattern) { $target.BlockPattern } else { $target.Pattern }
            $block = [regex]::Match($content, $blockPattern)
            if (-not $block.Success) { throw "$($target.Name) dependency block not found after version update" }
            $updatedBlock = $block.Value
            if ($target.Name -eq 'VC++ 2015-2022') {
              foreach ($arch in 'x86', 'x64', 'arm64') {
                $response = [System.Net.WebRequest]::Create("https://aka.ms/vc14/vc_redist.$arch.exe").GetResponse()
                try { $url = $response.ResponseUri.AbsoluteUri } finally { $response.Close() }
                $updatedBlock = [regex]::Replace(
                  $updatedBlock,
                  "https://download\.visualstudio\.microsoft\.com/download/pr/[^']*/VC_redist\.$arch\.exe",
                  $url
                )
              }
            }
            $content = $content.Replace($block.Value, (Set-BlockHashes $updatedBlock))
            $summaryName = $target.Name -replace " $($latest.Major)(?:\.$($latest.Minor))?$", ''
            $updates += "$summaryName $latest"
          }

          $dotnetFamilies = [ordered]@{
            Runtime        = 'Microsoft.NETCore.App'
            AspNetCore     = 'Microsoft.AspNetCore.App'
            DesktopRuntime = 'Microsoft.WindowsDesktop.App'
          }
          $dotnetMajors = @([regex]::Matches(
            $content,
            "Dependency_AddDotNetRuntime\('[^']+',\s*'[^']+',\s*'[^']+',\s*(?<major>\d+),"
          ) | ForEach-Object { [int]$_.Groups['major'].Value } |
            Where-Object { $_ -ge 5 } | Sort-Object -Unique)
          $hostingMajors = @([regex]::Matches($content, 'Dependency_AddDotNetHosting\((?<major>\d+),') |
            ForEach-Object { [int]$_.Groups['major'].Value } | Sort-Object -Unique)
          $dotnetPackages = @(
            foreach ($family in $dotnetFamilies.GetEnumerator()) {
              foreach ($major in $dotnetMajors) {
                [pscustomobject]@{ Name=$family.Key; Runtime=$family.Value; Major=$major }
              }
            }
            foreach ($major in $hostingMajors) {
              [pscustomobject]@{ Name='HostingBundle'; Runtime=$null; Major=$major }
            }
          )

          try {
            $supportedDotnetMajor = $dotnetMajors | Select-Object -Last 1
            $dotnetChannels = Invoke-RestMethod "$apiBase/m/Microsoft/DotNet/Runtime" -Headers $headers -ErrorAction Stop
            $newDotnetMajors = $dotnetChannels |
              Where-Object { $_.type -eq 'dir' -and $_.name -match '^\d+$' -and [int]$_.name -gt $supportedDotnetMajor } |
              ForEach-Object { [int]$_.name }
            foreach ($major in $newDotnetMajors) {
              if ((Get-WingetVersions "m/Microsoft/DotNet/Runtime/$major").Count -gt 0) {
                $failures += ".NET $major is stable but not supported in CodeDependencies.iss"
              }
            }
          } catch {
            $failures += "Failed to discover .NET channels: $_"
          }

          foreach ($package in $dotnetPackages) {
            $path = "m/Microsoft/DotNet/$($package.Name)/$($package.Major)"
            $label = ".NET $($package.Major) $($package.Name)"
            try {
              $latest = Get-WingetVersions $path | Sort-Object | Select-Object -Last 1
              if (-not $latest) { throw "No versions found" }
              $pattern = if (-not $package.Runtime) {
                "(?m)^(?<line>[^\r\n]*Dependency_AddDotNetHosting\($($package.Major),\s*(?<patch>\d+),[^\r\n]*)"
              } else {
                "(?m)^(?<line>[^\r\n]*Dependency_AddDotNetRuntime\('$([regex]::Escape($package.Runtime))',\s*'[^']+',\s*'[^']+',\s*$($package.Major),\s*(?<minor>\d+),\s*(?<patch>\d+),[^\r\n]*)"
              }
              $match = [regex]::Match($content, $pattern)
              if (-not $match.Success) { throw "Dependency line not found" }
              $minor = if ($package.Runtime) { $match.Groups['minor'].Value } else { 0 }
              $current = [Version]"$($package.Major).$minor.$($match.Groups['patch'].Value)"
              if (-not (Test-UpdateAvailable $label $current $latest)) { continue }

              $installers = @(Get-WingetInstallers $path $latest)
              $line = $match.Groups['line'].Value
              $oldVersion = if ($package.Runtime) { "$($current.Major), $($current.Minor), $($current.Build)," } else { "$($package.Major), $($current.Build)," }
              $newVersion = if ($package.Runtime) { "$($latest.Major), $($latest.Minor), $($latest.Build)," } else { "$($package.Major), $($latest.Build)," }
              $updatedLine = $line.Replace($oldVersion, $newVersion)
              if ($updatedLine -eq $line) { throw "Version fields not updated" }
              if (-not $package.Runtime) {
                $installer = Confirm-DotNetInstaller ($installers | Select-Object -First 1)
                $updatedLine = ([regex]"'https?://[^']+'").Replace($updatedLine, "'$($installer.Url)'", 1)
                $updatedLine = ([regex]"'[0-9a-fA-F]{64}'").Replace($updatedLine, "'$($installer.Checksum)'", 1)
              } else {
                $arches = if ($line -match "Dependency_StringX64\('https") { 'x86', 'x64' } else { 'x86', 'x64', 'arm64' }
                $selected = @($arches | ForEach-Object {
                  $arch = $_
                  $installer = $installers | Where-Object Architecture -eq $arch | Select-Object -First 1
                  if (-not $installer -and $arch -eq 'arm64') {
                    $installer = $installers | Where-Object Architecture -eq 'x64' | Select-Object -First 1
                  }
                  if (-not $installer) { throw "No $arch installer in $path $latest" }
                  Confirm-DotNetInstaller $installer
                })
                $urlWrapper = New-DependencyString @($selected.Url)
                $hashWrapper = New-DependencyString @($selected.Checksum)
                $updatedLine = ([regex]"Dependency_String(?:X64)?\('https?://[^)]*\)").Replace(
                  $updatedLine, [System.Text.RegularExpressions.MatchEvaluator] { param($m) $urlWrapper }, 1)
                $updatedLine = ([regex]"Dependency_String(?:X64)?\('[0-9a-fA-F]{64}'(?:,\s*'[0-9a-fA-F]{64}'){1,2}\)").Replace(
                  $updatedLine, [System.Text.RegularExpressions.MatchEvaluator] { param($m) $hashWrapper }, 1)
              }
              $content = $content.Replace($line, $updatedLine)
              $updates += ".NET $latest"
            } catch {
              $failures += "$label`: $_"
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

          if ($updates.Count -gt 0) {
            [System.IO.File]::WriteAllText($issPath, $content)
            $summary = ($updates | Sort-Object -Unique) -join ", "
            "updates_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "summary=$summary"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nUpdates found: $summary"
          } else {
            "updates_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nNo updates found"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Update ${{ steps.check-updates.outputs.summary }}"
          title: "Update ${{ steps.check-updates.outputs.summary }}"
          body: |
            Automated update based on WinGet and official release metadata:
            ${{ steps.check-updates.outputs.summary }}
          branch: update-winget-dependencies
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --body "" stops GitHub appending a Co-authored-by trailer to the squash commit
        run: gh pr merge --auto --squash --body "" ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }}
