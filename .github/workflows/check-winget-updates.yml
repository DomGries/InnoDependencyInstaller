name: Check Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for updates
        id: check-updates
        shell: pwsh
        run: |
          $indexUri = "https://cdn.winget.microsoft.com/cache/source2.msix"
          $rawBase = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests"
          $issPath = "CodeDependencies.iss"
          $content = Get-Content -Path $issPath -Raw
          $updates = @()
          $failures = @()
          $hashCache = @{}
          $manifestCache = @{}

          $headers = @{
            'Accept'               = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'InnoDependencyInstaller-dependency-check'
          }
          if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }

          function Invoke-WithRetry {
            param([scriptblock] $Action, [string] $Description)
            $delay = 10
            for ($attempt = 1; ; $attempt++) {
              try {
                $result = & $Action
                Start-Sleep -Milliseconds 200
                return $result
              } catch {
                $response = $_.Exception.Response
                $status = if ($response) { [int] $response.StatusCode } else { 0 }
                $isNetworkError = $_.Exception -is [System.Net.Http.HttpRequestException] -or
                  $_.Exception -is [System.Net.WebException] -or
                  $_.Exception -is [System.Threading.Tasks.TaskCanceledException]
                $retryable = ($status -in @(403, 408, 429)) -or ($status -ge 500) -or
                  ($status -eq 0 -and $isNetworkError)
                if (-not $retryable -or $attempt -ge 6) { throw }
                $wait = $delay
                $retryAfter = if ($response) { $response.Headers.RetryAfter } else { $null }
                if ($retryAfter -and $retryAfter.Delta) { $wait = [int] $retryAfter.Delta.TotalSeconds }
                $wait = [Math]::Min([Math]::Max($wait, 1), 300)
                Write-Host "$Description failed with status $status (attempt $attempt), retrying in $wait s"
                Start-Sleep -Seconds $wait
                $delay = [Math]::Min($delay * 2, 120)
              }
            }
          }

          function Invoke-GitHubApi {
            param([string] $Uri)
            Invoke-WithRetry { Invoke-RestMethod $Uri -Headers $headers -ErrorAction Stop } $Uri
          }

          $temporaryDirectory = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [System.IO.Path]::GetTempPath() }
          $indexPackage = Join-Path $temporaryDirectory 'winget-source.msix'
          $indexDatabase = Join-Path $temporaryDirectory 'winget-index.db'
          Invoke-WithRetry {
            Invoke-WebRequest $indexUri -OutFile $indexPackage -UseBasicParsing -ErrorAction Stop
          } $indexUri
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($indexPackage)
          try {
            $entry = $archive.GetEntry('Public/index.db')
            if (-not $entry) { throw "Public/index.db not found in $indexUri" }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $indexDatabase, $true)
          } finally {
            $archive.Dispose()
          }

          $wingetVersions = @{}
          foreach ($row in (sqlite3 -separator "`t" $indexDatabase 'select id, latest_version from packages')) {
            $fields = $row -split "`t", 2
            if ($fields.Count -eq 2) { $wingetVersions[$fields[0]] = $fields[1] }
          }
          if ($LASTEXITCODE -ne 0 -or $wingetVersions.Count -eq 0) {
            throw "Failed to read the WinGet source index"
          }
          Write-Host "Loaded $($wingetVersions.Count) packages from the WinGet source index"

          function Get-PackageIdentifier {
            param([string] $Path)
            (($Path -split '/') | Select-Object -Skip 1) -join '.'
          }

          function Get-WingetLatestVersion {
            param([string] $Path)
            $identifier = Get-PackageIdentifier $Path
            $version = $wingetVersions[$identifier]
            if (-not $version) { throw "Package $identifier not found in the WinGet source index" }
            $version
          }

          function Get-WingetInstallers {
            param([string] $Path)
            $identifier = Get-PackageIdentifier $Path
            $uri = "$rawBase/$Path/$(Get-WingetLatestVersion $Path)/$identifier.installer.yaml"
            if (-not $manifestCache.ContainsKey($uri)) {
              $manifestCache[$uri] = Invoke-WithRetry {
                (Invoke-WebRequest $uri -UseBasicParsing -ErrorAction Stop).Content
              } $uri
            }
            $manifest = $manifestCache[$uri]
            $installers = @([regex]::Matches($manifest, '(?ms)^- .*?(?=^- |\z)') | ForEach-Object {
              $block = $_.Value
              $arch = [regex]::Match($block, '(?m)^\s*(?:-\s*)?Architecture:\s*(\S+)')
              $url = [regex]::Match($block, '(?m)^\s*InstallerUrl:\s*(\S+)')
              $hash = [regex]::Match($block, '(?m)^\s*InstallerSha256:\s*([0-9A-Fa-f]{64})\s*$')
              $locale = [regex]::Match($block, '(?m)^\s*(?:-\s*)?InstallerLocale:\s*(\S+)')
              if ($arch.Success -and $url.Success -and $hash.Success) {
                [pscustomobject]@{
                  Architecture = $arch.Groups[1].Value
                  Url          = $url.Groups[1].Value
                  Checksum     = $hash.Groups[1].Value.ToLowerInvariant()
                  Locale       = if ($locale.Success) { $locale.Groups[1].Value } else { $null }
                }
              }
            })
            if ($installers.Count -eq 0) { throw "No installers found in $uri" }
            $installers
          }

          function New-DependencyString {
            param([string[]] $Values)
            $name = if ($Values.Count -eq 2) { 'Dependency_StringX64' } else { 'Dependency_String' }
            "$name(" + (($Values | ForEach-Object { "'$_'" }) -join ', ') + ')'
          }

          function Assert-InstallerUrl {
            param([string] $Url, $Target)
            $uri = [Uri]$Url
            $hostName = $uri.DnsSafeHost.ToLowerInvariant()
            $trustedHost = if ($Target.MicrosoftOwned) {
              $hostName -eq 'aka.ms' -or
                $hostName -eq 'microsoft.com' -or
                $hostName.EndsWith('.microsoft.com', [StringComparison]::Ordinal)
            } else {
              $hostName -in $Target.AllowedHosts
            }
            $allowed = $uri.Scheme -eq 'https' -and $trustedHost
            if (-not $allowed) {
              throw "Unexpected $($Target.Name) installer host: $Url"
            }
          }

          function Test-UpdateAvailable {
            param([string] $Name, [Version] $Current, [Version] $Latest)
            Write-Host "`nChecking $Name`: $Current -> $Latest"
            $Latest -gt $Current
          }

          function Set-BlockHashes {
            param([string] $Block)
            $urls = @([regex]::Matches($Block, "'(https?://[^']+)'") |
              ForEach-Object { $_.Groups[1].Value })
            $hashPattern = [regex]"'[0-9a-fA-F]{64}'"
            $matches = $hashPattern.Matches($Block)
            if ($urls.Count -ne $matches.Count) {
              throw "URL/checksum count mismatch in updated dependency block"
            }
            $hashes = @($urls | ForEach-Object {
              if (-not $hashCache.ContainsKey($_)) {
                $hashCache[$_] = & ./tools/Get-UrlSha256.ps1 $_
              }
              $hashCache[$_]
            })
            for ($i = $matches.Count - 1; $i -ge 0; $i--) {
              $Block = $Block.Remove($matches[$i].Index, $matches[$i].Length).
                Insert($matches[$i].Index, "'$($hashes[$i])'")
            }
            $Block
          }

          function Set-WingetInstallerMetadata {
            param([string] $Block, $Target)
            $installers = @(Get-WingetInstallers $Target.Path)
            if ($Target.InstallerUrlPattern) {
              $installers = @($installers | Where-Object Url -match $Target.InstallerUrlPattern)
            }
            if ($Target.InstallerLocale) {
              $installers = @($installers | Where-Object Locale -eq $Target.InstallerLocale)
            }
            if ($Target.SingleInstaller) {
              $installer = $installers | Select-Object -First 1
              if (-not $installer) { throw "No installer found for $($Target.Name)" }
              Assert-InstallerUrl $installer.Url $Target
              $urlPattern = [regex]"'https?://[^']+'"
              $hashPattern = [regex]"'[0-9a-fA-F]{64}'"
              if ($urlPattern.Matches($Block).Count -ne 1 -or $hashPattern.Matches($Block).Count -ne 1) {
                throw "Expected one URL/checksum pair"
              }
              $Block = $urlPattern.Replace($Block, "'$($installer.Url)'", 1)
              return $hashPattern.Replace($Block, "'$($installer.Checksum)'", 1)
            }

            $architectures = @($Target.Architectures | Where-Object { $_ })
            if ($architectures.Count -eq 0) {
              $architectures = if ($Block -match "Dependency_StringX64\('https") {
                'x86', 'x64'
              } else {
                'x86', 'x64', 'arm64'
              }
            }
            $selected = @($architectures | ForEach-Object {
              $arch = $_
              $architectureInstallers = $installers
              if ($Target.InstallerPaths) {
                $installerPath = $Target.InstallerPaths[$arch]
                if (-not $installerPath) { throw "No installer path configured for $arch" }
                $architectureInstallers = @(Get-WingetInstallers $installerPath)
              }
              $candidates = @($architectureInstallers |
                Where-Object Architecture -eq $arch |
                Sort-Object Url, Checksum -Unique)
              if ($candidates.Count -eq 0 -and $arch -eq 'arm64' -and $Target.Arm64Fallback) {
                $candidates = @($architectureInstallers |
                  Where-Object Architecture -eq 'x64' |
                  Sort-Object Url, Checksum -Unique)
              }
              if ($candidates.Count -ne 1) {
                throw "Expected one unique $arch installer, found $($candidates.Count)"
              }
              Assert-InstallerUrl $candidates[0].Url $Target
              $candidates[0]
            })
            $urlPattern = [regex]"Dependency_String(?:X64)?\('https?://[^)]*\)"
            $hashPattern = [regex]"Dependency_String(?:X64)?\('[0-9a-fA-F]{64}'(?:,\s*'[0-9a-fA-F]{64}'){1,2}\)"
            if ($urlPattern.Matches($Block).Count -ne 1 -or $hashPattern.Matches($Block).Count -ne 1) {
              throw "Expected one architecture URL/checksum pair"
            }
            $Block = $urlPattern.Replace(
              $Block, [System.Text.RegularExpressions.MatchEvaluator] { param($m) New-DependencyString @($selected.Url) }, 1)
            $hashPattern.Replace(
              $Block, [System.Text.RegularExpressions.MatchEvaluator] { param($m) New-DependencyString @($selected.Checksum) }, 1)
          }

          $commentVersionPattern = '(?m)^\s*// \S+ - (\d+(?:\.\d+)+)\s*$'

          $legacyVc = @(
            @{ Year = 2005; Major = 8;  VersionPath = 'x64' },
            @{ Year = 2008; Major = 9;  VersionPath = 'x64' },
            @{ Year = 2010; Major = 10; VersionPath = 'x64' },
            @{ Year = 2012; Major = 11; VersionPath = 'x64' },
            @{ Year = 2013; Major = 12; VersionPath = 'x64' }
          )
          $sqlExpress = @(
            @{ Year = 2017; Major = 14 },
            @{ Year = 2019; Major = 15 },
            @{ Year = 2022; Major = 16 },
            @{ Year = 2025; Major = 17 }
          )

          $targets = @(
            foreach ($vc in $legacyVc) {
              @{
                Name         = "VC++ $($vc.Year)"
                Path         = "m/Microsoft/VCRedist/$($vc.Year)/$($vc.VersionPath)"
                Major        = $vc.Major
                Kind         = 'components'
                Pattern      = "(Dependency_AddVCMsi\('$($vc.Year)',[^\r\n]*?,\s*$($vc.Major),\s*)(\d+),\s*(\d+),\s*(\d+)(,)"
                BlockPattern = "(?m)^procedure Dependency_AddVC$($vc.Year);.*$"
                Architectures = 'x86', 'x64'
                InstallerPaths = @{
                  x86 = "m/Microsoft/VCRedist/$($vc.Year)/x86"
                  x64 = "m/Microsoft/VCRedist/$($vc.Year)/x64"
                }
                MicrosoftOwned = $true
                InstallerMetadata = $true
              }
            }
            @{
              Name    = 'VC++ 2015-2022'
              Path    = 'm/Microsoft/VCRedist/2015+/x64'
              Major   = 14
              Kind    = 'components'
              Pattern = '(VisualStudio\\14\.0\\VC\\Runtimes[\s\S]*?PackVersionComponents\(14,\s*)(\d+),\s*(\d+),\s*(\d+)(\))'
              BlockPattern = '(?ms)^procedure Dependency_AddVC14;.*?^end;'
            }
            foreach ($sql in $sqlExpress) {
              @{
                Name              = "SQL Server $($sql.Year) Express"
                Path              = "m/Microsoft/SQLServer/$($sql.Year)/Express"
                Major             = $sql.Major
                Kind              = 'components'
                Pattern           = "(Dependency_AddSqlExpress\('$($sql.Year)',\s*'MSSQL$($sql.Major)\.MSSQLSERVER',\s*'[^']+',\s*$($sql.Major),\s*)(\d+),\s*(\d+),\s*(\d+)(,)"
                BlockPattern      = "(?m)^procedure Dependency_AddSql$($sql.Year)Express;.*$"
                Architectures     = 'x64', 'x64'
                MicrosoftOwned    = $true
                InstallerMetadata = $true
              }
            }
            foreach ($channel in 6, 7, 8) {
              @{
                Name              = "Windows App Runtime 1.$channel"
                SummaryName       = 'Windows App Runtime'
                Path              = "m/Microsoft/WindowsAppRuntime/1/$channel"
                Major             = 1
                Minor             = $channel
                Kind              = 'installers'
                Pattern           = "(?ms)^procedure Dependency_AddWinAppRuntime1$channel;.*?^end;"
                VersionPattern    = $commentVersionPattern
                Architectures     = 'x86', 'x64', 'arm64'
                MicrosoftOwned    = $true
                InstallerMetadata = $true
              }
            }
            @{
              Name    = 'Windows App Runtime 2'
              Repo    = 'microsoft/WindowsAppSDK'
              Major   = 2
              Kind    = 'text'
              Pattern = '(?ms)^procedure Dependency_AddWinAppRuntime2;.*?^end;'
              VersionPattern = '/windowsappsdk/\d+\.\d+/(\d+\.\d+\.\d+)/'
              UrlPattern = '/windowsappsdk/\d+\.\d+/\d+\.\d+\.\d+/'
            },
            @{
              Name          = 'WebView2 Runtime'
              Path          = 'm/Microsoft/EdgeWebView2Runtime'
              Kind          = 'installers'
              Pattern       = '(?ms)^procedure Dependency_AddWebView2;.*?^end;'
              VersionPattern = $commentVersionPattern
              Architectures = 'x86', 'x64', 'arm64'
              MicrosoftOwned = $true
              InstallerMetadata = $true
            },
            @{
              Name                = 'DirectX Runtime'
              Path                = 'm/Microsoft/DirectX'
              Kind                = 'installers'
              Pattern             = '(?ms)^procedure Dependency_AddDirectX;.*?^end;'
              VersionPattern      = $commentVersionPattern
              InstallerUrlPattern = '(?i)/dxwebsetup\.exe$'
              MicrosoftOwned      = $true
              SingleInstaller     = $true
              InstallerMetadata   = $true
            },
            @{
              Name              = 'ODBC Driver 18'
              Path              = 'm/Microsoft/msodbcsql/18'
              Kind              = 'installers'
              Pattern           = '(?ms)^procedure Dependency_AddSqlOdbc18;.*?^end;'
              VersionPattern    = $commentVersionPattern
              MicrosoftOwned    = $true
              InstallerLocale   = 'en-US'
              InstallerMetadata = $true
            },
            @{
              Name              = 'Access Database Engine 2016'
              Path              = 'm/Microsoft/AccessDatabaseEngine2016'
              Kind              = 'installers'
              Pattern           = '(?ms)^procedure Dependency_AddAccessDatabaseEngine2016;.*?^end;'
              VersionPattern    = $commentVersionPattern
              MicrosoftOwned    = $true
              InstallerMetadata = $true
            },
            @{
              Name              = 'VSTO Runtime'
              Path              = 'm/Microsoft/VSTOR'
              Kind              = 'installers'
              Pattern           = '(?ms)^procedure Dependency_AddVSTORuntime;.*?^end;'
              VersionPattern    = $commentVersionPattern
              MicrosoftOwned    = $true
              SingleInstaller   = $true
              InstallerMetadata = $true
            },
            @{
              Name    = 'Python 3.13'
              Path    = 'p/Python/Python/3/13'
              Major   = 3
              Minor   = 13
              Kind    = 'text'
              Pattern = '(?m)^procedure Dependency_AddPython313;.*$'
              VersionPattern = '/python/(\d+\.\d+\.\d+)/'
            },
            @{
              Name    = 'Python 3.14'
              Path    = 'p/Python/Python/3/14'
              Major   = 3
              Minor   = 14
              Kind    = 'text'
              Pattern = '(?m)^procedure Dependency_AddPython314;.*$'
              VersionPattern = '/python/(\d+\.\d+\.\d+)/'
            },
            @{
              Name    = 'PowerShell 7'
              Path    = 'm/Microsoft/PowerShell'
              Major   = 7
              Kind    = 'text'
              Pattern = '(?ms)^procedure Dependency_AddPowerShell7;.*?^end;'
              VersionPattern = '/download/v(\d+\.\d+\.\d+)/'
            }
          )

          $targets += 11, 17, 21, 25 | ForEach-Object {
            @{
              Name           = "Microsoft OpenJDK $_"
              Path           = "m/Microsoft/OpenJDK/$_"
              Major          = $_
              Kind           = 'text'
              Pattern        = "(?m)^procedure Dependency_AddJava$_;.*$"
              VersionPattern = 'microsoft-jdk-(\d+\.\d+\.\d+)-windows'
            }
          }

          $dotnet = @{
            HostingMajors = 8, 9, 10
            Channels      = @(
              @{ Label = '3.1'; Path = '3_1'; Major = 3; Minor = 1 },
              @{ Label = '5';   Path = '5';   Major = 5 },
              @{ Label = '6';   Path = '6';   Major = 6 },
              @{ Label = '7';   Path = '7';   Major = 7 },
              @{ Label = '8';   Path = '8';   Major = 8 },
              @{ Label = '9';   Path = '9';   Major = 9 },
              @{ Label = '10';  Path = '10';  Major = 10 }
            )
            Families      = @(
              @{ Name = 'Runtime';        Runtime = 'Microsoft.NETCore.App' },
              @{ Name = 'AspNetCore';     Runtime = 'Microsoft.AspNetCore.App' },
              @{ Name = 'DesktopRuntime'; Runtime = 'Microsoft.WindowsDesktop.App' }
            )
          }
          $targets += @(
            foreach ($family in $dotnet.Families) {
              foreach ($channel in $dotnet.Channels) {
                $runtime = [regex]::Escape($family.Runtime)
                @{
                  Name          = ".NET $($channel.Label) $($family.Name)"
                  SummaryName   = '.NET'
                  Path          = "m/Microsoft/DotNet/$($family.Name)/$($channel.Path)"
                  Major         = $channel.Major
                  Minor         = $channel.Minor
                  Kind          = 'dotnet-runtime'
                  Pattern       = "(?m)^[^\r\n]*Dependency_AddDotNetRuntime\('$runtime',\s*'[^']+',\s*'[^']+',\s*$($channel.Major),\s*(?<minor>\d+),\s*(?<patch>\d+),[^\r\n]*"
                  MicrosoftOwned = $true
                  Arm64Fallback = $true
                  InstallerMetadata = $true
                }
              }
            }
            foreach ($major in $dotnet.HostingMajors) {
              @{
                Name            = ".NET $major HostingBundle"
                SummaryName     = '.NET'
                Path            = "m/Microsoft/DotNet/HostingBundle/$major"
                Major           = $major
                Kind            = 'dotnet-hosting'
                Pattern         = "(?m)^[^\r\n]*Dependency_AddDotNetHosting\($major,\s*(?<patch>\d+),[^\r\n]*"
                MicrosoftOwned  = $true
                SingleInstaller = $true
                InstallerMetadata = $true
              }
            }
          )

          try {
            $pythonMinors = @($wingetVersions.Keys | ForEach-Object {
              if ($_ -match '^Python\.Python\.3\.(\d+)$') { [int] $Matches[1] }
            })
            $latestPythonMinor = ($pythonMinors | Measure-Object -Maximum).Maximum
            $supportedPythonMinor = ($targets | Where-Object { $_.Name -like 'Python *' } | ForEach-Object { [int]$_.Minor } | Measure-Object -Maximum).Maximum
            if ($null -eq $latestPythonMinor) {
              $failures += "No Python 3 channels found"
            } elseif ($latestPythonMinor -gt $supportedPythonMinor) {
              $failures += "Python 3.$latestPythonMinor is available but not supported in CodeDependencies.iss"
            }
          } catch {
            $failures += "Failed to discover Python channels: $_"
          }

          try {
            $supportedDotnetMajor = ($dotnet.Channels.Major | Measure-Object -Maximum).Maximum
            $dotnetMajors = @($wingetVersions.Keys | ForEach-Object {
              if ($_ -match '^Microsoft\.DotNet\.Runtime\.(\d+)$') { [int] $Matches[1] }
            })
            foreach ($major in ($dotnetMajors | Where-Object { $_ -gt $supportedDotnetMajor })) {
              $failures += ".NET $major is stable but not supported in CodeDependencies.iss"
            }
          } catch {
            $failures += "Failed to discover .NET channels: $_"
          }

          foreach ($target in $targets) {
            try {
              if ($target.Repo) {
                $data = Invoke-GitHubApi "https://api.github.com/repos/$($target.Repo)/releases?per_page=100"
                $versions = @($data |
                  Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
                  ForEach-Object { [Version]$_.tag_name.Substring(1) })
              } else {
                $versions = @([Version] (Get-WingetLatestVersion $target.Path))
              }
            } catch {
              $failures += "Failed to fetch $($target.Name) release metadata: $_"
              continue
            }

            if ($versions.Count -eq 0) {
              $failures += "No versions found for $($target.Name)"
              continue
            }

            $latest = ($versions | Sort-Object | Select-Object -Last 1)
            if ((($null -ne $target.Major) -and ($latest.Major -ne $target.Major)) -or
              (($null -ne $target.Minor) -and ($latest.Minor -ne $target.Minor))) {
              $failures += "$($target.Name) latest version $latest is outside its expected channel"
              continue
            }
            if ($target.Kind -eq 'text') {
              $latest = [Version]"$($latest.Major).$($latest.Minor).$($latest.Build)"
            } elseif ($target.Kind -eq 'components' -and $latest.Revision -lt 0) {
              $latest = [Version]"$($latest.Major).$($latest.Minor).$($latest.Build).0"
            }

            $blockPattern = if ($target.BlockPattern) { $target.BlockPattern } else { $target.Pattern }
            $block = [regex]::Match($content, $blockPattern)
            if (-not $block.Success) {
              $failures += "$($target.Name) dependency block not found in CodeDependencies.iss"
              continue
            }

            $match = [regex]::Match($block.Value, $target.Pattern)
            if (-not $match.Success) {
              $failures += "$($target.Name) version pattern not found in CodeDependencies.iss"
              continue
            }

            if ($target.Kind -eq 'components') {
              $current = [Version]"$($target.Major).$($match.Groups[2].Value).$($match.Groups[3].Value).$($match.Groups[4].Value)"
              $replacement = "`${1}$($latest.Minor), $($latest.Build), $($latest.Revision)`${5}"
            } elseif ($target.Kind -eq 'dotnet-runtime') {
              $current = [Version]"$($target.Major).$($match.Groups['minor'].Value).$($match.Groups['patch'].Value)"
              $replacement = $match.Value.Replace(
                "$($current.Major), $($current.Minor), $($current.Build),",
                "$($latest.Major), $($latest.Minor), $($latest.Build),")
            } elseif ($target.Kind -eq 'dotnet-hosting') {
              $current = [Version]"$($target.Major).0.$($match.Groups['patch'].Value)"
              $replacement = $match.Value.Replace(
                "$($current.Major), $($current.Build),",
                "$($latest.Major), $($latest.Build),")
            } else {
              $versionMatch = [regex]::Match($match.Value, $target.VersionPattern)
              if (-not $versionMatch.Success) {
                $failures += "$($target.Name) current version not found in CodeDependencies.iss"
                continue
              }
              $current = [Version]$versionMatch.Groups[1].Value
              if ($target.UrlPattern) {
                $replacement = [regex]::Replace($match.Value, $target.UrlPattern, "/windowsappsdk/$($latest.Major).$($latest.Minor)/$latest/")
              } else {
                $replacement = $match.Value.Replace($versionMatch.Groups[1].Value, "$latest")
              }
            }
            if (-not (Test-UpdateAvailable $target.Name $current $latest)) { continue }

            $updatedBlock = if ($target.Kind -eq 'components') {
              ([regex]$target.Pattern).Replace($block.Value, $replacement, 1)
            } else {
              $block.Value.Remove($match.Index, $match.Length).Insert($match.Index, $replacement)
            }
            if ($updatedBlock -eq $block.Value) { throw "$($target.Name) version fields not updated" }

            if ($target.InstallerMetadata) {
              $updatedBlock = Set-WingetInstallerMetadata $updatedBlock $target
              $summaryName = if ($target.SummaryName) { $target.SummaryName } else { $target.Name }
            } else {
              if ($target.Name -eq 'VC++ 2015-2022') {
                foreach ($arch in 'x86', 'x64', 'arm64') {
                  $response = [System.Net.WebRequest]::Create("https://aka.ms/vc14/vc_redist.$arch.exe").GetResponse()
                  try { $url = $response.ResponseUri.AbsoluteUri } finally { $response.Close() }
                  $updatedBlock = [regex]::Replace(
                    $updatedBlock,
                    "https://download\.visualstudio\.microsoft\.com/download/pr/[^']*/VC_redist\.$arch\.exe",
                    $url
                  )
                }
              }
              $updatedBlock = Set-BlockHashes $updatedBlock
              $summaryName = $target.Name -replace " $($latest.Major)(?:\.$($latest.Minor))?$", ''
            }
            $content = $content.Remove($block.Index, $block.Length).Insert($block.Index, $updatedBlock)
            $updates += "$summaryName $latest"
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

          if ($updates.Count -gt 0) {
            [System.IO.File]::WriteAllText($issPath, $content)
            $summary = ($updates | Sort-Object -Unique) -join ", "
            "updates_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "summary=$summary"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nUpdates found: $summary"
          } else {
            "updates_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "`nNo updates found"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app token
        id: app-token
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit-message: "Update ${{ steps.check-updates.outputs.summary }}"
          title: "Update ${{ steps.check-updates.outputs.summary }}"
          body: |
            Automated update based on WinGet and official release metadata:
            ${{ steps.check-updates.outputs.summary }}
          branch: update-winget-dependencies
          delete-branch: true
          labels: dependencies, automated

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge --auto --squash --body "" ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }}
